---
apiVersion: v1
kind: Service
metadata:
  name: aws-mock
  namespace: ${NAMESPACE}
spec:
  selector:
    name: aws-mock
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Pod
metadata:
  name: aws-mock-pod
  namespace: ${NAMESPACE}
  labels:
    name: aws-mock
    component: mock
spec:
  initContainers:
    - name: setup
      image: zenko/cloudserver:latest
      imagePullPolicy: Always
      command:
        - tar
        - -xvf
        - /static-config/mock-metadata.tar.gz
        - -C
        - /usr/src/app
      volumeMounts:
        - name: configmap
          mountPath: /static-config
        - name: metadata
          mountPath: /usr/src/app/localMetadata
  containers:
    - name: aws-mock
      image: zenko/cloudserver:latest
      env:
        - name: LOG_LEVEL
          value: trace
        - name: REMOTE_MANAGEMENT_DISABLE
          value: "1"
        - name: ENDPOINT
          value: aws-mock.${SUBDOMAIN}
        - name: S3BACKEND
          value: file
      ports:
        - name: http
          containerPort: 8000
      readinessProbe:
        tcpSocket:
          port: 8000
        initialDelaySeconds: 5
        periodSeconds: 2
        timeoutSeconds: 2
        successThreshold: 1
        failureThreshold: 3
      livenessProbe:
        tcpSocket:
          port: 8000
        initialDelaySeconds: 15
        periodSeconds: 10
        timeoutSeconds: 2
        failureThreshold: 3
      volumeMounts:
        - name: metadata
          mountPath: /usr/src/app/localMetadata
      resources:
        limits:
          cpu: "1"
          memory: 2Gi
        requests:
          cpu: "1"
          memory: 2Gi
  volumes:
    - name: metadata
      emptyDir: {}
    - name: configmap
      configMap:
        name: aws-mock
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aws-mock
  namespace: ${NAMESPACE}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 0m
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    cert-manager.io/cluster-issuer: artesca-root-ca-issuer
spec:
  tls:
    - secretName: aws-mock-tls
      hosts:
        - aws-mock.${SUBDOMAIN}
        - "*.aws-mock.${SUBDOMAIN}"
  rules:
    - host: aws-mock.${SUBDOMAIN}
      http:
        paths:
          - backend:
              service:
                name: aws-mock
                port:
                  name: http
            path: /
            pathType: Prefix
    - host: "*.aws-mock.${SUBDOMAIN}"
      http:
        paths:
          - backend:
              service:
                name: aws-mock
                port:
                  name: http
            path: /
            pathType: Prefix

