name: "Install doc dependencies"
description: "Prepare required packages before building the documentation"

runs:
  using: composite
  steps:
    - name: Cache deb packages
      id: cache-deb
      uses: actions/cache@v5
      with:
        path: ~/deb_cache
        key: ${{ runner.os }}-doc-deb-${{ hashFiles('docs/Dockerfile') }}
        restore-keys: |
          ${{ runner.os }}-doc-deb-
    - name: Install required dependencies
      shell: bash
      run: |
        set -e

        # Get the list of packages to install from the Dockerfile
        PACKAGES="$(sed -n -e 's/\\$//' -e 's/^[[:space:]]*//' -e '/apt-get install/,/apt-get clean/{//!p;}' docs/Dockerfile | xargs)"

        install_packages() {
          if [ -d "$HOME/deb_cache" ]; then
            sudo cp -R "$HOME/deb_cache/." /var/cache/apt/archives/
          fi

          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ${PACKAGES}

          if [ ! -d "$HOME/deb_cache" ]; then
            mkdir -p "$HOME/deb_cache"
            sudo cp -R /var/cache/apt/archives/*.deb "$HOME/deb_cache"
          fi
        }

        if ! install_packages; then
          echo "Switching to archive.ubuntu.com"
          sudo sed -i 's/azure\.//' /etc/apt/sources.list
          sudo apt-get update
          install_packages
        fi
    - name: Override plantuml
      shell: bash
      run: |
        sudo curl -f -Lo /usr/share/plantuml/plantuml.jar \
        https://github.com/plantuml/plantuml/releases/download/v1.2025.10/plantuml-1.2025.10.jar
