.:53 {
    errors
    health {
        lameduck 5s
    }
    ready
    log

    # Generic Zenko rewrite rules for {{subdomain}}
    rewrite name regex (.+\.)?aws-mock\.{{subdomain}} cloudserver-mock.{{namespace}}.svc.cluster.local
    rewrite name regex (.+\.)?azure-mock\.{{subdomain}} azurite-mock.{{namespace}}.svc.cluster.local
    
    # Restored Zenko Service Endpoints
    rewrite name regex iam\.{{subdomain}} zenko-iam.{{namespace}}.svc.cluster.local
    rewrite name regex sts\.{{subdomain}} zenko-sts.{{namespace}}.svc.cluster.local
    rewrite name regex s3\.{{subdomain}} zenko-s3.{{namespace}}.svc.cluster.local
    rewrite name regex keycloak\.{{subdomain}} zenko-keycloak.{{namespace}}.svc.cluster.local
    rewrite name regex management\.{{subdomain}} zenko-management.{{namespace}}.svc.cluster.local
    rewrite name regex ui\.{{subdomain}} zenko-ui.{{namespace}}.svc.cluster.local
    rewrite name regex shell-ui\.{{subdomain}} zenko-shell-ui.{{namespace}}.svc.cluster.local
    rewrite name regex utilization\.{{subdomain}} zenko-utilization.{{namespace}}.svc.cluster.local

    # Restored DR (Disaster Recovery) Endpoints
    rewrite name regex iam\.dr\.{{subdomain}} zenko-iam-dr.{{namespace}}.svc.cluster.local
    rewrite name regex sts\.dr\.{{subdomain}} zenko-sts-dr.{{namespace}}.svc.cluster.local
    rewrite name regex s3\.dr\.{{subdomain}} zenko-s3-dr.{{namespace}}.svc.cluster.local
    rewrite name regex keycloak\.dr\.{{subdomain}} zenko-keycloak-dr.{{namespace}}.svc.cluster.local
    rewrite name regex management\.dr\.{{subdomain}} zenko-management-dr.{{namespace}}.svc.cluster.local
    rewrite name regex ui\.dr\.{{subdomain}} zenko-ui-dr.{{namespace}}.svc.cluster.local
    rewrite name regex shell-ui\.dr\.{{subdomain}} zenko-shell-ui-dr.{{namespace}}.svc.cluster.local

    # Restored static rule from original config
    rewrite name exact s3c.local s3c-cloudserver.metadata.svc.cluster.local

    kubernetes cluster.local in-addr.arpa ip6.arpa {
        pods insecure
        fallthrough in-addr.arpa ip6.arpa
        ttl 30
    }
    prometheus :9153
    forward . /etc/resolv.conf
    cache 30
    loop
    reload
    loadbalance
}
