---
name: build-iso

on:
  workflow_call:
    inputs:
      build-type:
        type: string
        default: ''
        description: 'Release type passed to version.sh: release | preview | rc | empty (= dev)'
    outputs:
      artifacts-name:
        description: 'Staging artifact name for the uploaded ISOs'
        value: ${{ jobs.build.outputs.artifacts-name }}

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      artifacts-name: ${{ steps.upload.outputs.name }}
    env:
      BUILD_TYPE: ${{ inputs.build-type }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install tooling
        uses: ./.github/actions/install-end2end-dependencies
        with:
          tools: helm kustomize
      - name: Install ISO build dependencies
        shell: bash
        run: |-
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            genisoimage \
            isomd5sum \
            skopeo
      - name: Login to Registry
        uses: docker/login-action@v4
        with:
          username: '${{ github.repository_owner }}'
          password: '${{ github.token }}'
          registry: ghcr.io
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: '${{ secrets.DOCKERHUB_LOGIN }}'
          password: '${{ secrets.DOCKERHUB_PASSWORD }}'
      - name: Get token to access ZKOP
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.ACTIONS_APP_ID }}
          private-key: ${{ secrets.ACTIONS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            zenko-operator
      - name: Configure GIT
        run: git config --global url."https://git:${{ env.GIT_ACCESS_TOKEN }}@github.com/".insteadOf "https://github.com/"
        env:
          GIT_ACCESS_TOKEN: ${{ steps.app-token.outputs.token }}
      - name: Build ISOs
        env:
          PS4: '+ \D{%T}.${EPOCHREALTIME:11:3} '
        run: |-
          export PATH="/usr/local/bin:$PATH"
          parallel --halt now,fail=1 'cd {} && ./build.sh' ::: solution solution-base

          mkdir -p _build
          ln solution/_build/*.iso solution-base/_build/*.iso _build/
      - name: Upload ISOs
        id: upload
        uses: scality/action-artifacts@v4
        with:
          method: upload
          url: https://artifacts.scality.net
          user: ${{ secrets.ARTIFACTS_USER }}
          password: ${{ secrets.ARTIFACTS_PASSWORD }}
          source: _build
