---
name: build-kafka

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to check out. Defaults to the caller workflow ref.'
        type: string
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  java:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Registry
        uses: docker/login-action@v4
        with:
          username: "${{ github.repository_owner }}"
          password: "${{ github.token }}"
          registry: ghcr.io

      - name: Extract environment
        run: |-
          solution/kafka_build_vars.sh >> $GITHUB_ENV

      - name: Build and push java
        uses: docker/build-push-action@v7
        with:
          push: true
          context: ./solution/java
          tags: "${{ env.JAVA_IMAGE }}:${{ env.JAVA_TAG }}-${{ env.JAVA_BUILD_TREE_HASH }}"
          cache-from: |
            type=registry,ref=${{ env.JAVA_IMAGE }}:${{ env.JAVA_TAG }}-${{ env.JAVA_BUILD_TREE_HASH }}
            type=gha,scope=java-${{ env.JAVA_TAG }}
          cache-to: type=gha,mode=max,scope=java-${{ env.JAVA_TAG }}

  kafka:
    runs-on: ubuntu-24.04
    needs: java
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Registry
        uses: docker/login-action@v4
        with:
          username: "${{ github.repository_owner }}"
          password: "${{ github.token }}"
          registry: ghcr.io

      - name: Extract environment
        run: |-
          solution/kafka_build_vars.sh >> $GITHUB_ENV

      - name: Check kafka & kafka-connect versions match
        run: |-
          [ "${{ env.KAFKA_TAG }}-${{ env.MONGODB_CONNECTOR_TAG }}" = "${{ env.KAFKA_CONNECT_TAG }}" ]

      - name: Build and push kafka
        uses: docker/build-push-action@v7
        with:
          push: true
          context: ./solution/kafka
          build-args: |-
            BASE_IMAGE=${{ env.JAVA_IMAGE }}:${{ env.JAVA_TAG }}-${{ env.JAVA_BUILD_TREE_HASH }}
            scala_version=${{ env.scala_version }}
            kafka_version=${{ env.kafka_version }}
          tags: "${{ env.KAFKA_IMAGE }}:${{ env.KAFKA_TAG }}-${{ env.BUILD_TREE_HASH }}"
          cache-from: |
            type=registry,ref=${{ env.KAFKA_IMAGE }}:${{ env.KAFKA_TAG }}-${{ env.BUILD_TREE_HASH }}
            type=gha,scope=kafka-${{ env.KAFKA_TAG }}
          cache-to: type=gha,mode=max,scope=kafka-${{ env.KAFKA_TAG }}

      - name: Build and push kafka-connect
        uses: docker/build-push-action@v7
        with:
          push: true
          context: ./solution/kafka-connect
          build-args: |-
            JMX_JAVAAGENT_IMAGE=${{ env.JMX_JAVAAGENT_IMAGE }}
            JMX_JAVAAGENT_TAG=${{ env.JMX_JAVAAGENT_TAG }}
            KAFKA_IMAGE=${{ env.KAFKA_IMAGE }}
            KAFKA_TAG=${{ env.KAFKA_TAG }}-${{ env.BUILD_TREE_HASH }}
            MONGODB_CONNECTOR_TAG=${{ env.MONGODB_CONNECTOR_TAG }}
          tags: "${{ env.KAFKA_CONNECT_IMAGE }}:${{ env.KAFKA_CONNECT_TAG }}-${{ env.BUILD_TREE_HASH }}"
          cache-from: |
            type=registry,ref=${{ env.KAFKA_CONNECT_IMAGE }}:${{ env.KAFKA_CONNECT_TAG }}-${{ env.BUILD_TREE_HASH }}
            type=gha,scope=kafka-connect-${{ env.KAFKA_CONNECT_TAG }}
          cache-to: type=gha,mode=max,scope=kafka-connect-${{ env.KAFKA_CONNECT_TAG }}

  cruise-control:
    runs-on: ubuntu-24.04
    needs: java
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Registry
        uses: docker/login-action@v4
        with:
          username: "${{ github.repository_owner }}"
          password: "${{ github.token }}"
          registry: ghcr.io

      - name: Extract environment
        run: |-
          solution/kafka_build_vars.sh >> $GITHUB_ENV

      - name: Build and push cruise-control
        uses: docker/build-push-action@v7
        with:
          push: true
          context: ./solution/cruise-control
          build-args: |-
            BASE_IMAGE=${{ env.JAVA_IMAGE }}:${{ env.JAVA_TAG }}-${{ env.JAVA_BUILD_TREE_HASH }}
            CC_VERSION=${{ env.KAFKA_CRUISECONTROL_TAG }}
          tags: "${{ env.KAFKA_CRUISECONTROL_IMAGE }}:${{ env.KAFKA_CRUISECONTROL_TAG }}-${{ env.CRUISECONTROL_BUILD_TREE_HASH }}"
          cache-from: |
            type=registry,ref=${{ env.KAFKA_CRUISECONTROL_IMAGE }}:${{ env.KAFKA_CRUISECONTROL_TAG }}-${{ env.CRUISECONTROL_BUILD_TREE_HASH }}
            type=gha,scope=cruise-control-${{ env.KAFKA_CRUISECONTROL_TAG }}
          cache-to: type=gha,mode=max,scope=cruise-control-${{ env.KAFKA_CRUISECONTROL_TAG }}

  zookeeper:
    runs-on: ubuntu-24.04
    needs: java
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Registry
        uses: docker/login-action@v4
        with:
          username: "${{ github.repository_owner }}"
          password: "${{ github.token }}"
          registry: ghcr.io

      - name: Extract environment
        run: |-
          solution/kafka_build_vars.sh >> $GITHUB_ENV

      - name: Build and push zookeeper
        uses: docker/build-push-action@v7
        with:
          push: true
          context: ./solution/zookeeper
          build-args: |-
            BASE_IMAGE=${{ env.JAVA_IMAGE }}:${{ env.JAVA_TAG }}-${{ env.JAVA_BUILD_TREE_HASH }}
            ZK_VERSION=${{ env.ZK_VERSION }}
            ZK_OPERATOR_VERSION=${{ env.ZK_OPERATOR_VERSION }}
          tags: "${{ env.ZOOKEEPER_IMAGE }}:${{ env.ZOOKEEPER_TAG }}-${{ env.ZOOKEEPER_BUILD_TREE_HASH }}"
          cache-from: |
            type=registry,ref=${{ env.ZOOKEEPER_IMAGE }}:${{ env.ZOOKEEPER_TAG }}-${{ env.ZOOKEEPER_BUILD_TREE_HASH }}
            type=gha,scope=zookeeper-${{ env.ZOOKEEPER_TAG }}
          cache-to: type=gha,mode=max,scope=zookeeper-${{ env.ZOOKEEPER_TAG }}
