name: Post Merge

on:
  push:
    branches:
      - development/*

permissions:
  contents: read
  deployments: write
  actions: write

jobs:
  create-deployments:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create permanent deployments
        uses: ./.github/actions/create-component-deployments
        with:
          app-id: ${{ vars.ACTIONS_APP_ID }}
          app-private-key: ${{ secrets.ACTIONS_APP_PRIVATE_KEY }}
          environment: "zenko/${{ github.ref_name }}"
          status: success
          log-url: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          description: "Integrated in zenko ${{ github.ref_name }}"

  dispatch-cache-warmer:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch cache warmer on default branch
        run: |
          gh workflow run cache-warmer.yaml \
            --repo ${{ github.repository }} \
            --ref ${{ github.event.repository.default_branch }} \
            -f source_branch=${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
