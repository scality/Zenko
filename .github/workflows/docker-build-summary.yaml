---
name: docker-build-summary

# Single summary for all the docker builds of the run, uploaded by the
# upload-docker-builds action

on:
  workflow_call:

permissions:
  contents: read

jobs:
  summary:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/scripts

      - name: Download build descriptions
        uses: actions/download-artifact@v8
        with:
          pattern: docker-builds-*
          merge-multiple: true
          path: ${{ runner.temp }}/docker-builds

      - name: Write summary
        uses: actions/github-script@v7
        env:
          DIR: ${{ runner.temp }}/docker-builds
        with:
          script: |
            const { writeSummary } = require('./.github/scripts/docker-build-summary');
            await writeSummary(core, process.env.DIR);
