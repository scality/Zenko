.:53 {
    errors
    health {
        lameduck 5s
    }
    ready
    log

    # AWS Mock bucket DNS entries (explicit for virtual-hosted-style addressing)
    rewrite name exact ci-zenko-aws-target-bucket.aws-mock.{{subdomain}} ingress-nginx-controller.ingress-nginx.svc.cluster.local
    rewrite name exact ci-zenko-aws-crr-target-bucket.aws-mock.{{subdomain}} ingress-nginx-controller.ingress-nginx.svc.cluster.local
    rewrite name exact ci-zenko-aws-fail-target-bucket.aws-mock.{{subdomain}} ingress-nginx-controller.ingress-nginx.svc.cluster.local
    rewrite name exact ci-zenko-aws-replication-fail-ctst-bucket.aws-mock.{{subdomain}} ingress-nginx-controller.ingress-nginx.svc.cluster.local
    rewrite name exact aws-mock.{{subdomain}} ingress-nginx-controller.ingress-nginx.svc.cluster.local
    
    # Azure Mock DNS entries
    rewrite name exact azure-mock.{{subdomain}} ingress-nginx-controller.ingress-nginx.svc.cluster.local
    rewrite name exact blob.azure-mock.{{subdomain}} ingress-nginx-controller.ingress-nginx.svc.cluster.local
    rewrite name exact devstoreaccount1.blob.azure-mock.{{subdomain}} ingress-nginx-controller.ingress-nginx.svc.cluster.local
    rewrite name exact queue.azure-mock.{{subdomain}} ingress-nginx-controller.ingress-nginx.svc.cluster.local
    rewrite name exact devstoreaccount1.queue.azure-mock.{{subdomain}} ingress-nginx-controller.ingress-nginx.svc.cluster.local

    # Restored Zenko Service Endpoints
    rewrite name exact iam.{{subdomain}} ingress-nginx-controller.ingress-nginx.svc.cluster.local
    rewrite name exact sts.{{subdomain}} ingress-nginx-controller.ingress-nginx.svc.cluster.local
    rewrite name exact s3.{{subdomain}} ingress-nginx-controller.ingress-nginx.svc.cluster.local
    rewrite name exact keycloak.{{subdomain}} ingress-nginx-controller.ingress-nginx.svc.cluster.local
    rewrite name exact management.{{subdomain}} ingress-nginx-controller.ingress-nginx.svc.cluster.local
    rewrite name exact ui.{{subdomain}} ingress-nginx-controller.ingress-nginx.svc.cluster.local
    rewrite name exact shell-ui.{{subdomain}} ingress-nginx-controller.ingress-nginx.svc.cluster.local
    rewrite name exact utilization.{{subdomain}} ingress-nginx-controller.ingress-nginx.svc.cluster.local

    # Restored DR (Disaster Recovery) Endpoints
    rewrite name exact iam.dr.{{subdomain}} ingress-nginx-controller.ingress-nginx.svc.cluster.local
    rewrite name exact sts.dr.{{subdomain}} ingress-nginx-controller.ingress-nginx.svc.cluster.local
    rewrite name exact s3.dr.{{subdomain}} ingress-nginx-controller.ingress-nginx.svc.cluster.local
    rewrite name exact keycloak.dr.{{subdomain}} ingress-nginx-controller.ingress-nginx.svc.cluster.local
    rewrite name exact management.dr.{{subdomain}} ingress-nginx-controller.ingress-nginx.svc.cluster.local
    rewrite name exact ui.dr.{{subdomain}} ingress-nginx-controller.ingress-nginx.svc.cluster.local
    rewrite name exact shell-ui.dr.{{subdomain}} ingress-nginx-controller.ingress-nginx.svc.cluster.local

    # Website APIs
    rewrite name exact website.mywebsite.com ingress-nginx-controller.ingress-nginx.svc.cluster.local

    # RING endpoint
    rewrite name exact s3c.local s3c-cloudserver.metadata.svc.cluster.local

    kubernetes cluster.local in-addr.arpa ip6.arpa {
        pods insecure
        fallthrough in-addr.arpa ip6.arpa
        ttl 30
    }
    prometheus :9153
    forward . /etc/resolv.conf
    cache 30
    loop
    reload
    loadbalance
}
