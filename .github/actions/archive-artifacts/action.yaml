---
name: Archive artifact logs and data
description: Archive logs, pods and events

inputs:
  user:
    description: Artifacts user
    required: true
  password:
    description: Artifacts password
    required: true
  junit-paths:
    description: Path to junit reports
    default: ${{ github.workspace }}/_reports/*.xml
    required: true
  stage:
    description: Stage name
    default: ${{ github.job }}.${{ github.run_attempt }}
    required: true
  trunk_token:
    description: Trunk token
    required: false
  github_token:
    description: GitHub token used for publishing test report annotations
    default: ${{ github.token }}
    required: false
  zenko-name:
    description: Zenko name
    default: end2end
    required: false
  zenko-namespace:
    description: Namespace
    default: default
    required: false

runs:
  using: composite
  steps:
    - name: Setup artifacts link
      id: setup-artifacts
      uses: scality/action-artifacts@v4
      with:
        method: setup
        url: https://artifacts.scality.net
        user: ${{ inputs.user }}
        password: ${{ inputs.password }}

    - name: Download previous JUnit reports
      shell: bash
      run: |-
        # Download previous JUnit reports, one folder per attempt
        check_names=("${{ inputs.stage }}")
        report_paths=("${{ inputs.junit-paths }}")

        for attempt in $(seq 1 $(( ${{ github.run_attempt }} - 1 )) ); do
          name="${{ github.job }}.${attempt}"
          dir="/tmp/junit-previous/${name}"

          mkdir -p "$dir"
          FILES=$(curl -f -s -u "${{ inputs.user }}:${{ inputs.password }}" \
              "${{ steps.setup-artifacts.outputs.link }}/data/${{ github.job }}.${attempt}/reports/?format=txt" \
            || true)

          while IFS= read -r filename; do
            [ -z "$filename" ] && continue
            curl -f -s -u "${{ inputs.user }}:${{ inputs.password }}" \
                "${{ steps.setup-artifacts.outputs.link }}/data/${{ github.job }}.${attempt}/reports/${filename}" \
                -o "${dir}/${filename}" \
              || echo "::warning::Failed to download ${{ github.job }}.${attempt} report: ${filename}"
          done <<< "$FILES"

          check_names=("${name}" "${check_names[@]}")
          report_paths=("/tmp/junit-previous/${name}/*.xml" "${report_paths[@]}")
        done

        set_output() { echo "$1<<EOF"; printf '%s\n' "${@:2}"; echo "EOF"; } >> "$GITHUB_OUTPUT"

        set_output "check-names" "${check_names[@]}"
        set_output "report-paths" "${report_paths[@]}"
      id: download-previous-reports

    - name: Merge JUnit reports
      shell: bash
      run: |-
        # Merge JUnit reports
        STAGE=/tmp/artifacts/data/${{ inputs.stage }}
        mkdir -p "$STAGE"
        shopt -s nullglob globstar

        python3 ".github/scripts/merge-junit-reports.py" "$STAGE/junit-merged.xml" \
            ${{ inputs.junit-paths }} /tmp/junit-previous/**/*.xml
      id: merge-junit
      continue-on-error: true

    - name: Publish test report
      uses: mikepenz/action-junit-report@v6
      with:
        token: ${{ inputs.github_token }}
        annotate_only: true
        check_name: ${{ steps.download-previous-reports.outputs.check-names }}
        report_paths: ${{ steps.download-previous-reports.outputs.report-paths }}
        job_summary: ${{ steps.merge-junit.outputs.failures > 0 || steps.merge-junit.outputs.errors > 0 }}
        flaky_summary: true
        detailed_summary: true
        verbose_summary: false
        group_reports: false
        include_time_in_summary: true
      continue-on-error: true

    - name: Compute build success
      uses: mikepenz/action-junit-report@v6
      with:
        token: ${{ inputs.github_token }}
        annotate_only: true
        check_name: ${{ inputs.stage }}
        skip_annotations: true
        report_paths: /tmp/artifacts/data/${{ inputs.stage }}/junit-merged.xml
        job_summary: false
        check_retries: true
        require_tests: ${{ job.status == 'success' }}
        fail_on_failure: true

    - name: Upload results
      uses: trunk-io/analytics-uploader@v1
      with:
        junit-paths: ${{ inputs.junit-paths }}
        org-slug: ${{ github.repository_owner }}
        token: ${{ inputs.trunk_token }}
      if: inputs.trunk_token && job.status != 'cancelled'
      continue-on-error: true

    - name: Archive test reports to artifacts
      shell: bash
      run: |-
        # Archive test reports to artifacts
        set -exu
        mkdir -p /tmp/artifacts/data/${STAGE}/reports
        cp -r ${{ inputs.junit-paths }} /tmp/artifacts/data/${STAGE}/reports/ 2>/dev/null || echo "No reports found"
      env:
        STAGE: ${{ inputs.stage }}
      if: always()
      continue-on-error: true

    - name: Archive artifact logs and data
      shell: bash
      run: |-
        # Archive artifact logs and data
        set -exu

        mkdir -p /tmp/artifacts/data/${STAGE}/kind-logs
        kubectl get pods -A -o yaml > /tmp/artifacts/data/${STAGE}/kind-logs/all-pods.log || true
        kubectl get events -A -o yaml > /tmp/artifacts/data/${STAGE}/kind-logs/all-events.log || true
        kubectl get zenko -A -o yaml > /tmp/artifacts/data/${STAGE}/kind-logs/all-zenkos.log || true
        kubectl get zenkodrsource -A -o yaml > /tmp/artifacts/data/${STAGE}/kind-logs/all-zenkodrsources.log || true
        kubectl get zenkodrsink -A -o yaml > /tmp/artifacts/data/${STAGE}/kind-logs/all-zenkodrsinks.log || true
        kind export logs /tmp/artifacts/data/${STAGE}/kind-logs/kind-export || true
        cp -r /artifacts/data/fluentbit-logs /tmp/artifacts/data/${STAGE}/kind-logs/fluentbit-logs 2>/dev/null || true
        for container_log in /tmp/artifacts/data/${STAGE}/kind-logs/kind-export/*/containers/*.log; do
          [ -f "$container_log" ] || continue
          fb_file="/tmp/artifacts/data/${STAGE}/kind-logs/fluentbit-logs/$(basename "$container_log")"
          [ -f "$fb_file" ] || continue
          ln -sf "../../../fluentbit-logs/$(basename "$container_log")" "$container_log"
        done
        tar zcvf /tmp/artifacts/${{ github.sha }}-${STAGE}-logs-volumes.tgz /tmp/artifacts/data/${STAGE}/kind-logs
      env:
        STAGE: ${{ inputs.stage }}
      if: always()
      continue-on-error: true

    - name: Dump kafka
      shell: bash
      run: |-
        # Dump kafka topics
        set -exu

        KAFKA=$(kubectl get pods -n ${NAMESPACE} -lkafka_cr=${ZENKO_NAME}-base-queue -o jsonpath='{.items[0].metadata.name}')
        KAFKA_PATH="/tmp/artifacts/data/${STAGE}/kafka"
        
        mkdir -p ${KAFKA_PATH}

        kubectl exec -in ${NAMESPACE} ${KAFKA} -c kafka -- \
            env KAFKA_OPTS= kafka-topics.sh --bootstrap-server :9092 --list \
            > ${KAFKA_PATH}/kafka-topics.log

        kubectl exec -in ${NAMESPACE} ${KAFKA} -c kafka -- \
            env KAFKA_OPTS= kafka-consumer-groups.sh --bootstrap-server :9092 --list \
            > ${KAFKA_PATH}/kafka-consumer-groups.log

        kubectl exec -in ${NAMESPACE} ${KAFKA} -c kafka  -- \
                   env KAFKA_OPTS= kafka-consumer-groups.sh --bootstrap-server :9092 --describe --all-groups \
                   > ${KAFKA_PATH}/kafka-offsets.log

        KAFKA_SERVICE=$(kubectl get services -n ${NAMESPACE} -lkafka_cr=${ZENKO_NAME}-base-queue -o jsonpath='{.items[0].metadata.name}')
        kubectl run -n ${NAMESPACE} kcat --image=edenhill/kcat:1.7.1 --restart=Never --command -- sleep 300        
        kubectl wait -n ${NAMESPACE} pod kcat --for=condition=ready
        cat ${KAFKA_PATH}/kafka-topics.log | grep -v '^__' | xargs -P 15 -I {} \
            sh -c "kubectl exec -i -n ${NAMESPACE} kcat -- \
                       kcat -L -b ${KAFKA_SERVICE} -t {}  -C -o beginning -e -q -J \
                       > ${KAFKA_PATH}/kafka-messages-{}.log"
      env:
        STAGE: ${{ inputs.stage }}
        NAMESPACE: ${{ inputs.zenko-namespace }}
        ZENKO_NAME: ${{ inputs.zenko-name }}
      if: always()
      continue-on-error: true

    - name: Dump MongoDB
      shell: bash
      run: |-
        # Dump MongoDB
        set -exu

        ZENKO_MONGODB_DATABASE="${ZENKO_MONGODB_DATABASE:-zenko-database}"
        MONGODB_ROOT_USERNAME="${MONGODB_ROOT_USERNAME:-root}"
        MONGODB_ROOT_PASSWORD="${MONGODB_ROOT_PASSWORD:-rootpass}"
        NAMESPACE="${NAMESPACE:-default}"
        DUMP_DIR="/tmp/mongodb.dump"

        kubectl exec -n ${NAMESPACE} data-db-mongodb-sharded-mongos-0 -- mongodump \
            --db ${ZENKO_MONGODB_DATABASE} -u ${MONGODB_ROOT_USERNAME} -p ${MONGODB_ROOT_PASSWORD} \
            --authenticationDatabase admin --out ${DUMP_DIR}

        kubectl exec -n ${NAMESPACE} data-db-mongodb-sharded-mongos-0 -- bash -c \
            "for bson_file in ${DUMP_DIR}/${ZENKO_MONGODB_DATABASE}/*.bson; do \
               json_file=\"${DUMP_DIR}/\$(basename \${bson_file} .bson).json\"; \
               bsondump --outFile \${json_file} \${bson_file}; \
             done"

        mkdir -p /tmp/artifacts/data/${STAGE}/mongodb-dump
        kubectl cp ${NAMESPACE}/data-db-mongodb-sharded-mongos-0:${DUMP_DIR} /tmp/artifacts/data/${STAGE}/mongodb-dump
      env:
        STAGE: ${{ inputs.stage }}
        NAMESPACE: ${{ inputs.zenko-namespace }}
        ZENKO_NAME: ${{ inputs.zenko-name }}
      if: always()
      continue-on-error: true

    - name: Upload artifacts                               # move into `archive-artifacts` action
      uses: scality/action-artifacts@v4
      with:
        method: upload
        url: https://artifacts.scality.net
        user: ${{ inputs.user }}
        password: ${{ inputs.password }}
        source: /tmp/artifacts
      if: always()