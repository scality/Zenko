.:53 {
    errors
    health {
        lameduck 5s
    }
    ready
    log

    # Generic Zenko rewrite rules for {{subdomain}}
    rewrite name regex (.+\.)?aws-mock\.{{subdomain}} ingress-nginx-controller.ingress-nginx.svc.cluster.local
    rewrite name regex (.+\.)?azure-mock\.{{subdomain}} ingress-nginx-controller.ingress-nginx.svc.cluster.local
    rewrite name exact aws-mock.zenko.local ingress-nginx-controller.ingress-nginx.svc.cluster.local

    # Restored Zenko Service Endpoints
    rewrite name regex iam\.{{subdomain}} ingress-nginx-controller.ingress-nginx.svc.cluster.local
    rewrite name regex sts\.{{subdomain}} ingress-nginx-controller.ingress-nginx.svc.cluster.local
    rewrite name regex s3\.{{subdomain}} ingress-nginx-controller.ingress-nginx.svc.cluster.local
    rewrite name regex keycloak\.{{subdomain}} ingress-nginx-controller.ingress-nginx.svc.cluster.local
    rewrite name regex management\.{{subdomain}} ingress-nginx-controller.ingress-nginx.svc.cluster.local
    rewrite name regex ui\.{{subdomain}} ingress-nginx-controller.ingress-nginx.svc.cluster.local
    rewrite name regex shell-ui\.{{subdomain}} ingress-nginx-controller.ingress-nginx.svc.cluster.local
    rewrite name regex utilization\.{{subdomain}} ingress-nginx-controller.ingress-nginx.svc.cluster.local

    # Restored DR (Disaster Recovery) Endpoints
    rewrite name regex iam\.dr\.{{subdomain}} ingress-nginx-controller.ingress-nginx.svc.cluster.local
    rewrite name regex sts\.dr\.{{subdomain}} ingress-nginx-controller.ingress-nginx.svc.cluster.local
    rewrite name regex s3\.dr\.{{subdomain}} ingress-nginx-controller.ingress-nginx.svc.cluster.local
    rewrite name regex keycloak\.dr\.{{subdomain}} ingress-nginx-controller.ingress-nginx.svc.cluster.local
    rewrite name regex management\.dr\.{{subdomain}} ingress-nginx-controller.ingress-nginx.svc.cluster.local
    rewrite name regex ui\.dr\.{{subdomain}} ingress-nginx-controller.ingress-nginx.svc.cluster.local
    rewrite name regex shell-ui\.dr\.{{subdomain}} ingress-nginx-controller.ingress-nginx.svc.cluster.local

    # Restored static rule from original config
    rewrite name exact s3c.local ingress-nginx-controller.ingress-nginx.svc.cluster.local

    # Website APIs
    rewrite name exact website.mywebsite.com ingress-nginx-controller.ingress-nginx.svc.cluster.local

    # RING endpoint
    rewrite name exact s3c.local ingress-nginx-controller.ingress-nginx.svc.cluster.local

    kubernetes cluster.local in-addr.arpa ip6.arpa {
        pods insecure
        fallthrough in-addr.arpa ip6.arpa
        ttl 30
    }
    prometheus :9153
    forward . /etc/resolv.conf
    cache 30
    loop
    reload
    loadbalance
}
