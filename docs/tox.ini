[tox]
skipsdist = true

[testenv:pip-compile]
basepython = python3
description = Update the requirements.txt file
skip_install = true
deps =
    pip-tools
    typing_extensions
commands =
    pip-compile --upgrade -o "{toxinidir}/docsource/requirements.txt" "{toxinidir}/docsource/requirements.in"
setenv =
    CUSTOM_COMPILE_COMMAND = tox -e pip-compile

[testenv:docs]
passenv = READTHEDOCS
description = Render documentation
skip_install = true
deps =
#     {[testenv]deps}
commands =
    pip install --upgrade pip
    pip install setuptools==64.0.0
    pip install -r{toxinidir}/docsource/requirements.txt
    pip list
    make -C docsource {posargs:html}
setenv =
    O=-j4 -n -W
    SPHINXOPTS=-j4 -n -W
allowlist_externals =
    make
    pip

