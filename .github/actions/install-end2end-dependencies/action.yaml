name: "Setup End2End environment"
description: "installation of dependencies"

runs:
  using: composite
  steps:
    - name: Install kind
      uses: helm/kind-action@v1
      with:
        version: ${{ env.KIND_VERSION }}
        install_only: true

    - name: Install helm
      uses: azure/setup-helm@v4
      with:
        version: ${{ env.HELM_VERSION }}

    - name: Install kubectl
      uses: Azure/setup-kubectl@v5
      with:
        version: 'v${{ env.KUBECTL_VERSION }}'

    - name: Cache kustomize
      id: cache-kustomize
      uses: actions/cache@v5
      with:
        path: /usr/local/bin/kustomize
        key: ${{ runner.os }}-kustomize-${{ env.KUSTOMIZE_VERSION }}

    - name: Install kustomize
      if: steps.cache-kustomize.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -exu
        curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${{ env.KUSTOMIZE_VERSION }}/kustomize_${{ env.KUSTOMIZE_VERSION }}_linux_amd64.tar.gz" \
          | sudo tar -xz -C /usr/local/bin kustomize

    - name: Cache tilt
      id: cache-tilt
      uses: actions/cache@v5
      with:
        path: /usr/local/bin/tilt
        key: ${{ runner.os }}-tilt-${{ env.TILT_VERSION }}

    - name: Install tilt
      if: steps.cache-tilt.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -exu
        curl -fsSL "https://github.com/tilt-dev/tilt/releases/download/v${{ env.TILT_VERSION }}/tilt.${{ env.TILT_VERSION }}.linux.x86_64.tar.gz" \
          | sudo tar -xz -C /usr/local/bin tilt
