---
apiVersion: v1
kind: Service
metadata:
  name: azure-mock
  namespace: ${NAMESPACE}
spec:
  selector:
    name: azure-mock
  type: ClusterIP
  ports:
    - name: blob
      port: 80
      targetPort: blob
    - name: queue
      port: 81
      targetPort: queue
---
apiVersion: v1
kind: Pod
metadata:
  name: azure-mock-pod
  namespace: ${NAMESPACE}
  labels:
    name: azure-mock
    component: mock
spec:
  hostname: devstoreaccount1
  subdomain: azure-mock
  containers:
    - name: azurite
      image: mcr.microsoft.com/azure-storage/azurite:3.35.0
      command:
        - azurite
        - -l
        - /data
        - --blobHost
        - 0.0.0.0
        - --blobPort
        - "80"
        - --queueHost
        - 0.0.0.0
        - --queuePort
        - "81"
      ports:
        - name: blob
          containerPort: 80
        - name: queue
          containerPort: 81
      readinessProbe:
        tcpSocket:
          port: 80
        initialDelaySeconds: 3
        periodSeconds: 2
        timeoutSeconds: 2
        successThreshold: 1
        failureThreshold: 3
      livenessProbe:
        tcpSocket:
          port: 80
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 2
        failureThreshold: 3
      imagePullPolicy: Always
      resources:
        limits:
          cpu: "1"
          memory: 2Gi
        requests:
          cpu: "1"
          memory: 2Gi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: azure-mock
  namespace: ${NAMESPACE}
  annotations:
    cert-manager.io/cluster-issuer: artesca-root-ca-issuer
spec:
  tls:
    - secretName: zenko-tls-azure
      hosts:
        - azure-mock.${SUBDOMAIN}
        - "*.azure-mock.${SUBDOMAIN}"
        - "*.blob.azure-mock.${SUBDOMAIN}"
        - "*.queue.azure-mock.${SUBDOMAIN}"
  rules:
    - host: "*.azure-mock.${SUBDOMAIN}"
      http:
        paths:
          - backend:
              service:
                name: azure-mock
                port:
                  name: blob
            path: /
            pathType: Prefix
    - host: azure-mock.${SUBDOMAIN}
      http:
        paths:
          - backend:
              service:
                name: azure-mock
                port:
                  name: blob
            path: /
            pathType: Prefix
    - host: "*.blob.azure-mock.${SUBDOMAIN}"
      http:
        paths:
          - backend:
              service:
                name: azure-mock
                port:
                  name: blob
            path: /
            pathType: Prefix
    - host: blob.azure-mock.${SUBDOMAIN}
      http:
        paths:
          - backend:
              service:
                name: azure-mock
                port:
                  name: blob
            path: /
            pathType: Prefix
    - host: queue.azure-mock.${SUBDOMAIN}
      http:
        paths:
          - backend:
              service:
                name: azure-mock
                port:
                  name: queue
            path: /
            pathType: Prefix
    - host: "*.queue.azure-mock.${SUBDOMAIN}"
      http:
        paths:
          - backend:
              service:
                name: azure-mock
                port:
                  name: queue
            path: /
            pathType: Prefix
    - host: devstoreaccount1.blob.azure-mock.${SUBDOMAIN}
      http:
        paths:
          - backend:
              service:
                name: azure-mock
                port:
                  name: blob
            path: /
            pathType: Prefix
    - host: devstoreaccount1.queue.azure-mock.${SUBDOMAIN}
      http:
        paths:
          - backend:
              service:
                name: azure-mock
                port:
                  name: queue
            path: /
            pathType: Prefix

