# These tests are meant to go hand-in-hand with the rendered alert rule.
# Use github.com/scality/action-prom-render-test@python-renderer python module
#
# Render the alerts file with
#   alertgen alerts.yaml -i 'namespace=zenko,service=data-db-mongodb-sharded,pvc=datadir-mongodb'

evaluation_interval: 30s

rule_files:
  - alerts.rendered.yaml

tests:
  - name: MongoDbDown
    interval: 30s
    input_series:
      - series: up{namespace="zenko", job="zenko/data-db-mongodb-sharded-shard0-data", pod="data-db-mongodb-sharded-shard0-data-0"}
        values: 1 1 0 0 0 0 1 1 1
      - series: up{namespace="zenko", job="zenko/data-db-mongodb-sharded-shard0-data", pod="data-db-mongodb-sharded-shard0-data-1"}
        values: 1 1 1 1 0 0 0 1 1
      - series: up{namespace="zenko", job="zenko/data-db-mongodb-sharded-shard0-data", pod="data-db-mongodb-sharded-shard0-data-2"}
        values: 1 1 1 1 1 0 0 0 1
      - series: up{namespace="zenko", job="zenko/data-db-mongodb-sharded-shard0-data", pod="data-db-mongodb-sharded-shard1-data-0"}
        values: 1x9
      - series: up{namespace="zenko", job="zenko/data-db-mongodb-sharded-shard0-data", pod="data-db-mongodb-sharded-shard1-data-1"}
        values: 1x9
      - series: up{namespace="zenko", job="zenko/data-db-mongodb-sharded-shard0-data", pod="data-db-mongodb-sharded-shard1-data-2"}
        values: 1x9
      - series: kube_statefulset_replicas{namespace="zenko", statefulset="data-db-mongodb-sharded-shard0-data", job="kube-state-metrics"}
        values: 3x9
      - series: kube_statefulset_replicas{namespace="zenko", statefulset="data-db-mongodb-sharded-shard1-data", job="kube-state-metrics"}
        values: 3x9
    alert_rule_test:
      - { alertname: MongoDbDegraded, eval_time: 30s, exp_alerts: [] }

      - { alertname: MongoDbDegraded, eval_time: 60s, exp_alerts: [] }

      - alertname: MongoDbDegraded
        eval_time: 90s
        exp_alerts:
          - exp_labels:
              severity: warning
              job: shard0-data
              statefulset: data-db-mongodb-sharded-shard0-data
            exp_annotations:
              description: "Less than 100% of MongoDb shard0-data instances are up and healthy: 2."
              summary: MongoDb shard0-data service degraded

      - alertname: MongoDbDegraded
        eval_time: 120s
        exp_alerts:
          - exp_labels:
              severity: warning
              job: shard0-data
              statefulset: data-db-mongodb-sharded-shard0-data
            exp_annotations:
              description: "Less than 100% of MongoDb shard0-data instances are up and healthy: 1."
              summary: MongoDb shard0-data service degraded

      - alertname: MongoDbDegraded
        eval_time: 150s
        exp_alerts:
          - exp_labels:
              severity: warning
              job: shard0-data
              statefulset: data-db-mongodb-sharded-shard0-data
            exp_annotations:
              description: "Less than 100% of MongoDb shard0-data instances are up and healthy: 0."
              summary: MongoDb shard0-data service degraded
          - exp_labels:
              severity: critical
              job: shard0-data
              statefulset: data-db-mongodb-sharded-shard0-data
            exp_annotations:
              description: "Less than 50% of MongoDb shard0-data instances are up and healthy: 0."
              summary: MongoDb shard0-data service critical
      
      - alertname: MongoDbDegraded
        eval_time: 180s
        exp_alerts:
          - exp_labels:
              severity: warning
              job: shard0-data
              statefulset: data-db-mongodb-sharded-shard0-data
            exp_annotations:
              description: "Less than 100% of MongoDb shard0-data instances are up and healthy: 1."
              summary: MongoDb shard0-data service degraded
          - exp_labels:
              severity: critical
              job: shard0-data
              statefulset: data-db-mongodb-sharded-shard0-data
            exp_annotations:
              description: "Less than 50% of MongoDb shard0-data instances are up and healthy: 1."
              summary: MongoDb shard0-data service critical

  - name: NoPrimary
    interval: 1m
    input_series:
      - series: mongodb_rs_members_state{namespace="zenko",pod="data-db-mongodb-sharded-shard0-data-0",member_state="PRIMARY"}
        values: 1 _

    alert_rule_test:
      - alertname: NoPrimary
        eval_time: 1m
        exp_alerts: []
      - alertname: NoPrimary
        eval_time: 2m
        exp_alerts:
          - exp_labels:
              namespace: zenko
              member_state: PRIMARY
              severity: critical
            exp_annotations:
              description: "MongoDb has no PRIMARY."
              summary: MongoDb down

  - name: UnhealthyMemberWarning
    interval: 30s
    input_series:
      - series: mongodb_rs_members_health{namespace="zenko",pod="data-db-mongodb-sharded-shardsrv-0", member_idx="data-db-mongodb-sharded-shardsrv-0.data-db-mongodb-sharded-headless.svc.cluster.local", member_state="PRIMARY"}
        values: 1 1 1 1
      - series: mongodb_rs_members_health{namespace="zenko",pod="data-db-mongodb-sharded-shardsrv-0", member_idx="data-db-mongodb-sharded-shardsrv-1.data-db-mongodb-sharded-headless.svc.cluster.local", member_state="SECONDARY"}
        values: 1 1 1 1
      - series: mongodb_rs_members_health{namespace="zenko",pod="data-db-mongodb-sharded-shardsrv-0", member_idx="data-db-mongodb-sharded-shardsrv-2.data-db-mongodb-sharded-headless.svc.cluster.local", member_state="SECONDARY"}
        values: 1 1 0 0
      - series: mongodb_rs_members_health{namespace="zenko",pod="data-db-mongodb-sharded-shardsrv-1", member_idx="data-db-mongodb-sharded-shardsrv-0.data-db-mongodb-sharded-headless.svc.cluster.local", member_state="PRIMARY"}
        values: 1 1 1 1
      - series: mongodb_rs_members_health{namespace="zenko",pod="data-db-mongodb-sharded-shardsrv-1", member_idx="data-db-mongodb-sharded-shardsrv-1.data-db-mongodb-sharded-headless.svc.cluster.local", member_state="SECONDARY"}
        values: 1 1 1 1
      - series: mongodb_rs_members_health{namespace="zenko",pod="data-db-mongodb-sharded-shardsrv-1", member_idx="data-db-mongodb-sharded-shardsrv-2.data-db-mongodb-sharded-headless.svc.cluster.local", member_state="SECONDARY"}
        values: 1 1 0 0
      - series: mongodb_rs_members_health{namespace="zenko",pod="data-db-mongodb-sharded-shardsrv-2", member_idx="data-db-mongodb-sharded-shardsrv-0.data-db-mongodb-sharded-headless.svc.cluster.local", member_state="PRIMARY"}
        values: 1 1 _ _
      - series: mongodb_rs_members_health{namespace="zenko",pod="data-db-mongodb-sharded-shardsrv-2", member_idx="data-db-mongodb-sharded-shardsrv-1.data-db-mongodb-sharded-headless.svc.cluster.local", member_state="SECONDARY"}
        values: 1 1 _ _
      - series: mongodb_rs_members_health{namespace="zenko",pod="data-db-mongodb-sharded-shardsrv-2", member_idx="data-db-mongodb-sharded-shardsrv-2.data-db-mongodb-sharded-headless.svc.cluster.local", member_state="SECONDARY"}
        values: 1 1 _ _

    alert_rule_test:
      - alertname: UnhealthyMemberWarning
        eval_time: 1m
        exp_alerts: []
      - alertname: UnhealthyMemberWarning
        eval_time: 2m
        exp_alerts:
          - exp_labels:
              member_idx: data-db-mongodb-sharded-shardsrv-2
              severity: warning
              member_state: SECONDARY
            exp_annotations:
              description: Member data-db-mongodb-sharded-shardsrv-2 (SECONDARY) is not healthy.
              summary: Unhealthy MongoDb member

  - interval: 30s
    input_series:
      - series: mongodb_rs_members_electionDate{namespace="zenko", pod="data-db-mongodb-sharded-shard0-data-0", job="zenko/data-db-mongodb-sharded-shard0-data"}
        values: 1+0x9 10+1x10
      - series: mongodb_rs_members_electionDate{namespace="zenko", pod="data-db-mongodb-sharded-cfgsvr-0", job="zenko/data-db-mongodb-sharded-cfgsvr"}
        values: 1+0x20

    alert_rule_test:
      - alertname: TooManyElectionsWarning
        eval_time: 9m
        exp_alerts: []
      - alertname: TooManyElectionsWarning
        eval_time: 10m
        exp_alerts:
          - exp_labels:
              severity: warning
              job: shard0-data
            exp_annotations:
              description: Number of elections in last 10m is greater than 10 for `shard0-data`.
              summary: Too many elections

  - name: ReplicationLagWarning
    interval: 1m
    input_series:
      - series: mongodb_oplog_stats_storageStats_maxSize{namespace="zenko",pod="data-db-mongodb-sharded-shard0-data-0", rs_nm="shard0-data"}
        values: 100000x15
      - series: mongodb_oplog_stats_storageStats_size{namespace="zenko",pod="data-db-mongodb-sharded-shard0-data-0", rs_nm="shard0-data"}
        values: 51000x15

      - series: mongodb_rs_members_optimeDate{namespace="zenko",pod="data-db-mongodb-sharded-shard0-data-0", rs_nm="shard0-data", member_idx="data-db-mongodb-sharded-shard0-data-0.data-db-mongodb-sharded-shardsrv-headless.svc.cluster.local", member_state="PRIMARY"}
        values: 5  35000+1000x10 45000
      - series: mongodb_rs_members_optimeDate{namespace="zenko",pod="data-db-mongodb-sharded-shard0-data-0", rs_nm="shard0-data", member_idx="data-db-mongodb-sharded-shard0-data-1.data-db-mongodb-sharded-shardsrv-headless.svc.cluster.local", member_state="SECONDARY"}
        values: 0  24000+1000x10 39000
      - series: mongodb_rs_members_optimeDate{namespace="zenko",pod="data-db-mongodb-sharded-shard0-data-0", rs_nm="shard0-data", member_idx="data-db-mongodb-sharded-shard0-data-2.data-db-mongodb-sharded-shardsrv-headless.svc.cluster.local", member_state="SECONDARY"}
        values: 2  2000+1000x7 7000+0x2 41000

      - series: mongodb_rs_members_optimeDate{namespace="zenko",pod="data-db-mongodb-sharded-shard0-data-1", rs_nm="shard0-data", member_idx="data-db-mongodb-sharded-shard0-data-0.data-db-mongodb-sharded-shardsrv-headless.svc.cluster.local", member_state="PRIMARY"}
        values: 5  34000+1000x10 44000
      - series: mongodb_rs_members_optimeDate{namespace="zenko",pod="data-db-mongodb-sharded-shard0-data-1", rs_nm="shard0-data", member_idx="data-db-mongodb-sharded-shard0-data-1.data-db-mongodb-sharded-shardsrv-headless.svc.cluster.local", member_state="SECONDARY"}
        values: 0  26000+1000x10 40000
      - series: mongodb_rs_members_optimeDate{namespace="zenko",pod="data-db-mongodb-sharded-shard0-data-1", rs_nm="shard0-data", member_idx="data-db-mongodb-sharded-shard0-data-2.data-db-mongodb-sharded-shardsrv-headless.svc.cluster.local", member_state="SECONDARY"}
        values: 2   1000+1000x7 6000+0x2 40000

      - series: mongodb_rs_members_optimeDate{namespace="zenko",pod="data-db-mongodb-sharded-shard0-data-2", rs_nm="shard0-data", member_idx="data-db-mongodb-sharded-shard0-data-0.data-db-mongodb-sharded-shardsrv-headless.svc.cluster.local", member_state="PRIMARY"}
        values: 5  12000+1000x10 43000
      - series: mongodb_rs_members_optimeDate{namespace="zenko",pod="data-db-mongodb-sharded-shard0-data-2", rs_nm="shard0-data", member_idx="data-db-mongodb-sharded-shard0-data-1.data-db-mongodb-sharded-shardsrv-headless.svc.cluster.local", member_state="SECONDARY"}
        values: 0   9000+1000x10 38000
      - series: mongodb_rs_members_optimeDate{namespace="zenko",pod="data-db-mongodb-sharded-shard0-data-2", rs_nm="shard0-data", member_idx="data-db-mongodb-sharded-shard0-data-2.data-db-mongodb-sharded-shardsrv-headless.svc.cluster.local", member_state="SECONDARY"}
        values: 2   3000+1000x7 8000+0x2 42000

      - series: mongodb_mongod_replset_my_state{namespace="zenko",pod="data-db-mongodb-sharded-shard0-data-0"}
        values: 1+0x12
      - series: mongodb_mongod_replset_my_state{namespace="zenko",pod="data-db-mongodb-sharded-shard0-data-1"}
        values: 2+0x12
      - series: mongodb_mongod_replset_my_state{namespace="zenko",pod="data-db-mongodb-sharded-shard0-data-2"}
        values: 2+0x12

      - series: mongodb_rs_members_optimeDate{namespace="zenko",pod="data-db-mongodb-sharded-configsvr-1", rs_nm="configsvr", member_idx="data-db-mongodb-sharded-configsvr-0.data-db-mongodb-sharded-configsvr-headless.svc.cluster.local", member_state="PRIMARY"}
        values: 71  8300  9500
      - series: mongodb_rs_members_optimeDate{namespace="zenko",pod="data-db-mongodb-sharded-configsvr-1", rs_nm="configsvr", member_idx="data-db-mongodb-sharded-configsvr-1.data-db-mongodb-sharded-configsvr-headless.svc.cluster.local", member_state="SECONDARY"}
        values: 50  8200  9400

      # We simulate a constant oplog window for this test. In real life, the oplog window can increase
      # or decrease depending on the load.
      - series: mongodb_mongod_replset_oplog_head_timestamp{namespace="zenko",pod="data-db-mongodb-sharded-shard0-data-0"}
        values: 38000+1000x12
      - series: mongodb_mongod_replset_oplog_tail_timestamp{namespace="zenko",pod="data-db-mongodb-sharded-shard0-data-0"}
        values: 1000+1000x12

    alert_rule_test:
      - alertname: ReplicationLagWarning
        eval_time: 1m
        exp_alerts: []
      - alertname: ReplicationLagWarning
        eval_time: 2m
        exp_alerts: []
      - alertname: ReplicationLagWarning
        eval_time: 10m
        exp_alerts:
          - exp_labels:
              severity: warning
              member_idx: data-db-mongodb-sharded-shard0-data-2
              rs_nm: shard0-data
            exp_annotations:
              description: "The replication lag for `data-db-mongodb-sharded-shard0-data-2` has exceeded 70% of the journal window duration. This condition may occur during periods of elevated load and does not necessitate immediate intervention."
              summary: MongoDB replication lag is high
      - alertname: ReplicationLagWarning
        eval_time: 11m
        exp_alerts:
          - exp_labels:
              severity: warning
              member_idx: data-db-mongodb-sharded-shard0-data-2
              rs_nm: shard0-data
            exp_annotations:
              description: "The replication lag for `data-db-mongodb-sharded-shard0-data-2` has exceeded 70% of the journal window duration. This condition may occur during periods of elevated load and does not necessitate immediate intervention."
              summary: MongoDB replication lag is high
          - exp_labels:
              severity: critical
              member_idx: data-db-mongodb-sharded-shard0-data-2
              rs_nm: shard0-data
            exp_annotations:
              description: |
                Replication lag for `data-db-mongodb-sharded-shard0-data-2` exceeds 90% of the oplog window. 
                If this occurs frequently during peak usage, it indicates a potential sizing issue. 
                Please contact a Scality representative for assistance.
              summary: MongoDB replication lag is critical
      - alertname: ReplicationLagWarning
        eval_time: 12m
        exp_alerts: []

  - name: ReplicationLagWarning with oplog window not full
    interval: 1m
    input_series:
      - series: mongodb_oplog_stats_storageStats_maxSize{namespace="zenko",pod="data-db-mongodb-sharded-shard0-data-0", rs_nm="shard0-data"}
        values: 100000x15
      - series: mongodb_oplog_stats_storageStats_size{namespace="zenko",pod="data-db-mongodb-sharded-shard0-data-0", rs_nm="shard0-data"}
        values: 1000+1000x15

      - series: mongodb_rs_members_optimeDate{namespace="zenko",pod="data-db-mongodb-sharded-shard0-data-0", rs_nm="shard0-data", member_idx="data-db-mongodb-sharded-shard0-data-0.data-db-mongodb-sharded-shardsrv-headless.svc.cluster.local", member_state="PRIMARY"}
        values: 5  35000+1000x10 45000
      - series: mongodb_rs_members_optimeDate{namespace="zenko",pod="data-db-mongodb-sharded-shard0-data-0", rs_nm="shard0-data", member_idx="data-db-mongodb-sharded-shard0-data-1.data-db-mongodb-sharded-shardsrv-headless.svc.cluster.local", member_state="SECONDARY"}
        values: 0  24000+1000x10 39000
      - series: mongodb_rs_members_optimeDate{namespace="zenko",pod="data-db-mongodb-sharded-shard0-data-0", rs_nm="shard0-data", member_idx="data-db-mongodb-sharded-shard0-data-2.data-db-mongodb-sharded-shardsrv-headless.svc.cluster.local", member_state="SECONDARY"}
        values: 2  2000+1000x7 7000+0x2 41000

      - series: mongodb_rs_members_optimeDate{namespace="zenko",pod="data-db-mongodb-sharded-shard0-data-1", rs_nm="shard0-data", member_idx="data-db-mongodb-sharded-shard0-data-0.data-db-mongodb-sharded-shardsrv-headless.svc.cluster.local", member_state="PRIMARY"}
        values: 5  34000+1000x10 44000
      - series: mongodb_rs_members_optimeDate{namespace="zenko",pod="data-db-mongodb-sharded-shard0-data-1", rs_nm="shard0-data", member_idx="data-db-mongodb-sharded-shard0-data-1.data-db-mongodb-sharded-shardsrv-headless.svc.cluster.local", member_state="SECONDARY"}
        values: 0  26000+1000x10 40000
      - series: mongodb_rs_members_optimeDate{namespace="zenko",pod="data-db-mongodb-sharded-shard0-data-1", rs_nm="shard0-data", member_idx="data-db-mongodb-sharded-shard0-data-2.data-db-mongodb-sharded-shardsrv-headless.svc.cluster.local", member_state="SECONDARY"}
        values: 2   1000+1000x7 6000+0x2 40000

      - series: mongodb_rs_members_optimeDate{namespace="zenko",pod="data-db-mongodb-sharded-shard0-data-2", rs_nm="shard0-data", member_idx="data-db-mongodb-sharded-shard0-data-0.data-db-mongodb-sharded-shardsrv-headless.svc.cluster.local", member_state="PRIMARY"}
        values: 5  12000+1000x10 43000
      - series: mongodb_rs_members_optimeDate{namespace="zenko",pod="data-db-mongodb-sharded-shard0-data-2", rs_nm="shard0-data", member_idx="data-db-mongodb-sharded-shard0-data-1.data-db-mongodb-sharded-shardsrv-headless.svc.cluster.local", member_state="SECONDARY"}
        values: 0   9000+1000x10 38000
      - series: mongodb_rs_members_optimeDate{namespace="zenko",pod="data-db-mongodb-sharded-shard0-data-2", rs_nm="shard0-data", member_idx="data-db-mongodb-sharded-shard0-data-2.data-db-mongodb-sharded-shardsrv-headless.svc.cluster.local", member_state="SECONDARY"}
        values: 2   3000+1000x7 8000+0x2 42000

      - series: mongodb_mongod_replset_my_state{namespace="zenko",pod="data-db-mongodb-sharded-shard0-data-0"}
        values: 1+0x12
      - series: mongodb_mongod_replset_my_state{namespace="zenko",pod="data-db-mongodb-sharded-shard0-data-1"}
        values: 2+0x12
      - series: mongodb_mongod_replset_my_state{namespace="zenko",pod="data-db-mongodb-sharded-shard0-data-2"}
        values: 2+0x12

      - series: mongodb_rs_members_optimeDate{namespace="zenko",pod="data-db-mongodb-sharded-configsvr-1", rs_nm="configsvr", member_idx="data-db-mongodb-sharded-configsvr-0.data-db-mongodb-sharded-configsvr-headless.svc.cluster.local", member_state="PRIMARY"}
        values: 71  8300  9500
      - series: mongodb_rs_members_optimeDate{namespace="zenko",pod="data-db-mongodb-sharded-configsvr-1", rs_nm="configsvr", member_idx="data-db-mongodb-sharded-configsvr-1.data-db-mongodb-sharded-configsvr-headless.svc.cluster.local", member_state="SECONDARY"}
        values: 50  8200  9400

      # We simulate a constant oplog window for this test. In real life, the oplog window can increase
      # or decrease depending on the load.
      - series: mongodb_mongod_replset_oplog_head_timestamp{namespace="zenko",pod="data-db-mongodb-sharded-shard0-data-0"}
        values: 38000+1000x12
      - series: mongodb_mongod_replset_oplog_tail_timestamp{namespace="zenko",pod="data-db-mongodb-sharded-shard0-data-0"}
        values: 1000+1000x12

    alert_rule_test:
      - alertname: ReplicationLagWarning
        eval_time: 1m
        exp_alerts: []
      - alertname: ReplicationLagWarning
        eval_time: 2m
        exp_alerts: []
      - alertname: ReplicationLagWarning
        eval_time: 10m
        exp_alerts: []
      - alertname: ReplicationLagWarning
        eval_time: 11m
        exp_alerts: []
      - alertname: ReplicationLagWarning
        eval_time: 12m
        exp_alerts: []

  - name: TooManyClientConnectionsWarning
    interval: 1m
    input_series:
      - series: mongodb_ss_connections{namespace="zenko",pod="data-db-mongodb-sharded-mongos-0", job="zenko/data-db-mongodb-sharded-mongos", conn_type="current"}
        values: 90 98 110 110

    alert_rule_test:
      - alertname: TooManyClientConnectionsWarning
        eval_time: 2m
        exp_alerts: []
      - alertname: TooManyClientConnectionsWarning
        eval_time: 4m
        exp_alerts:
          - exp_labels:
              severity: warning
              job: mongos
            exp_annotations:
              description: Too many client connections on `mongos`.
              summary: Too many MongoDB client connections

  - name: RemainingDiskSpaceWarning
    interval: 1m
    input_series:
      - series: kubelet_volume_stats_available_bytes{namespace="zenko",persistentvolumeclaim="datadir-mongodb-0"}
        values: 30-5x3
      - series: kubelet_volume_stats_capacity_bytes{namespace="zenko",persistentvolumeclaim="datadir-mongodb-0"}
        values: 100+0x3

    alert_rule_test:
      - alertname: RemainingDiskSpaceWarning
        eval_time: 2m
        exp_alerts: []
      - alertname: RemainingDiskSpaceWarning
        eval_time: 4m
        exp_alerts:
          - exp_labels:
              severity: warning
              namespace: zenko
              persistentvolumeclaim: datadir-mongodb-0
            exp_annotations:
              description: MongoDb has low disk space
              summary: MongoDb has low disk space
    

  # mongodb_rs_members_state has one series per (reporting pod, member):
  # every pod's exporter reports the state of every replica-set member. Here
  # member data-1 is RECOVERING (3) while data-0 is PRIMARY (1) and data-2 is
  # SECONDARY (2); all three pods report it, and exactly one alert per
  # severity must fire, naming the recovering member (ZENKO-5332).
  - name: MongoDbPodRecovering
    interval: 1m
    input_series:
      # Reported by data-0 (itself PRIMARY, rs_state=1).
      - series: mongodb_rs_members_state{namespace="zenko", pod="data-db-mongodb-sharded-shard0-data-0", rs_nm="data-db-mongodb-sharded-shard-0", member_idx="data-db-mongodb-sharded-shard0-data-0.data-db-mongodb-sharded-headless.zenko.svc.cluster.local:27017", member_state="PRIMARY", rs_state="1"}
        values: 1x1440
      - series: mongodb_rs_members_state{namespace="zenko", pod="data-db-mongodb-sharded-shard0-data-0", rs_nm="data-db-mongodb-sharded-shard-0", member_idx="data-db-mongodb-sharded-shard0-data-1.data-db-mongodb-sharded-headless.zenko.svc.cluster.local:27017", member_state="RECOVERING", rs_state="1"}
        values: 3x1440
