---
name: release
run-name: Release (${{ inputs.type }}) on ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - release
          - preview
          - rc

jobs:
  verify-release:
    name: Verify if tag is valid
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute version
        id: version
        shell: bash
        run: |
          source ./version.sh --${{ inputs.type }}
          echo "tag=$VERSION_FULL" >> "$GITHUB_OUTPUT"
          echo "prerelease=${VERSION_PRERELEASE:+true}" >> "$GITHUB_OUTPUT"

      - name: Check if tag matches the branch name
        shell: bash
        run: |
          if [[ "${{ steps.version.outputs.tag }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+(-.*)?$ ]]; then
            # Hotfix release: extract base version from tag (e.g., 2.13.5 from 2.13.5.1)
            # which must match branch name
            [[ "refs/heads/hotfix/${{ steps.version.outputs.tag }}" == "${{ github.ref }}-"* ]]
          elif [[ "${{ steps.version.outputs.tag }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-.*)?$ ]]; then
            # Regular release: tag must match branch name
            [[ "refs/heads/development/${{ steps.version.outputs.tag }}" == "${{ github.ref }}."* ]]
          else
            echo "Error: Tag must be in format X.Y.Z(-<prerelease>) or X.Y.Z-N (hotfix)"
            exit 1
          fi

      - name: Check if tag has not already been created
        shell: bash
        run: |
          ! git show-ref --tags ${{ steps.version.outputs.tag }} --quiet

  build-iso:
    needs: verify-release
    uses: ./.github/workflows/build-iso.yaml
    with:
      build-type: ${{ inputs.type }}
    secrets: inherit

  # Write the .final_status marker, which is required by the artifacts server
  # before allowing promotion.
  update-artifact-status:
    needs: build-iso
    runs-on: ubuntu-24.04
    steps:
      - name: Upload final status
        uses: scality/actions/upload_final_status@1.17.0
        with:
          ARTIFACTS_USER: ${{ secrets.ARTIFACTS_USER }}
          ARTIFACTS_PASSWORD: ${{ secrets.ARTIFACTS_PASSWORD }}
          JOBS_RESULTS: success

  release:
    name: Release
    runs-on: ubuntu-24.04
    needs:
      - verify-release
      - update-artifact-status
    env:
      TAG: ${{ needs.verify-release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate release notes
        uses: actions/github-script@v7
        with:
          script: |
            // Get all releases
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            // Convert semver-compliant hotfix tags (e.g., 2.13.5-1) to 4-digits format for comparison
            let tag = process.env.TAG;
            const hotfixMatch = tag.match(/^(\d+\.\d+\.\d+)-(\d+)$/);
            if (hotfixMatch) {
              tag = `${hotfixMatch[1]}.${hotfixMatch[2]}`;
            }

            // Get the previous release tag
            const { getPreviousTag } = require('./.github/scripts/get-previous-tag');
            const previous_tag = getPreviousTag(process.env.TAG, releases);
            if (!previous_tag) {
              core.warning("No previous version found");
              return;
            }

            // Generate release notes
            const { data: releaseNotes } = await github.rest.repos.generateReleaseNotes({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.TAG,
              target_commitish: context.sha,
              previous_tag_name: previous_tag,
            });
            core.exportVariable('RELEASE_NOTES', releaseNotes.body);

      - name: Create Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Release ${{ env.TAG }}
          tag_name: ${{ env.TAG }}
          generate_release_notes: false
          body: ${{ env.RELEASE_NOTES }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.verify-release.outputs.prerelease == 'true' }}

  create-deployments:
    runs-on: ubuntu-24.04
    needs:
      - verify-release
      - release
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Create release deployments
        uses: ./.github/actions/create-component-deployments
        with:
          app-id: ${{ vars.ACTIONS_APP_ID }}
          app-private-key: ${{ secrets.ACTIONS_APP_PRIVATE_KEY }}
          environment: "zenko/${{ needs.verify-release.outputs.tag }}"
          status: success
          production: 'true'
          log-url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.verify-release.outputs.tag }}
          description: "Released in zenko ${{ needs.verify-release.outputs.tag }}"

  promote:
    runs-on: ubuntu-24.04
    needs:
      - verify-release
      - build-iso
      - update-artifact-status
      - create-deployments
      - release
    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Promote artifacts
      uses: scality/action-artifacts@v4
      with:
        method: promote
        name: ${{ needs.build-iso.outputs.artifacts-name }}
        tag: ${{ needs.verify-release.outputs.tag }}
        url: https://artifacts.scality.net
        user: ${{ secrets.ARTIFACTS_USER }}
        password: ${{ secrets.ARTIFACTS_PASSWORD }}
