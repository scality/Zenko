name: Build Setup Image
description: Build the Zenko setup Docker image for use in Kubernetes Jobs

inputs:
  registry:
    description: 'Container registry to push to'
    required: false
    default: 'ghcr.io'
  image-name:
    description: 'Image name'
    required: false
    default: 'zenko-setup'
  tag:
    description: 'Image tag'
    required: false
    default: 'latest'
  push:
    description: 'Push image to registry'
    required: false
    default: 'true'

outputs:
  image:
    description: 'Full image name with tag'
    value: ${{ inputs.registry }}/${{ github.repository_owner }}/${{ inputs.image-name }}:${{ inputs.tag }}
  digest:
    description: 'Image digest'
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      if: ${{ inputs.push == 'true' }}
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ github.token }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ inputs.registry }}/${{ github.repository_owner }}/${{ inputs.image-name }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=${{ inputs.tag }}

    - name: Build and push
      id: build
      uses: docker/build-push-action@v5
      with:
        context: tests/@setup
        file: tests/@setup/Dockerfile
        push: ${{ inputs.push }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64